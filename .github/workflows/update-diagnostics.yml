name: Diagnose iPhone update compatibility
on:
  push:
    branches: [main]
    paths: [.github/workflows/update-diagnostics.yml]
  workflow_dispatch:
    inputs:
      build_id:
        description: Installed iPhone build ID
        default: 80141fd8-cadc-4ca0-93dc-283208106346
        required: true
      update_id:
        description: Published iOS update ID
        default: 01a0f90a-a86c-7994-90e8-9b47ad60d259
        required: true
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_ID: ${{ inputs.build_id || '80141fd8-cadc-4ca0-93dc-283208106346' }}
      UPDATE_ID: ${{ inputs.update_id || '01a0f90a-a86c-7994-90e8-9b47ad60d259' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Compare installed and published native fingerprints
        run: eas fingerprint:compare --build-id "$BUILD_ID" --update-id "$UPDATE_ID" --non-interactive
