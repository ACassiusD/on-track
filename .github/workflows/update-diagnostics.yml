name: Diagnose iPhone update compatibility
on:
  push:
    branches: [main]
    paths: [.github/workflows/update-diagnostics.yml]
  workflow_dispatch:
    inputs:
      build_fingerprint:
        description: Installed iPhone runtime fingerprint
        default: 551f60e49b852547d4b4acb1c9f0e2d7f0751c24
        required: true
      update_fingerprint:
        description: Published iOS runtime fingerprint
        default: e6292ee821685fb93e7401321acaf58bff41ddea
        required: true
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      BUILD_FINGERPRINT: ${{ inputs.build_fingerprint || '551f60e49b852547d4b4acb1c9f0e2d7f0751c24' }}
      UPDATE_FINGERPRINT: ${{ inputs.update_fingerprint || 'e6292ee821685fb93e7401321acaf58bff41ddea' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Compare installed and published native fingerprints
        run: eas fingerprint:compare "$BUILD_FINGERPRINT" "$UPDATE_FINGERPRINT" --non-interactive
